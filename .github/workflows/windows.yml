name: Build

on:
  push:
    branches: [main, windows-port]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
          pacboy: >-
            rust:p
            gcc:p
            pkgconf:p
            gtk4:p
            libadwaita:p
            librsvg:p
            adwaita-icon-theme:p

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: target
          key: msys2-ucrt64-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Bundle GTK runtime
        run: bash packaging/windows/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ayuz-windows-x86_64
          path: dist/ayuz-windows-x86_64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ayuz-windows-x86_64.zip

  linux:
    name: Linux (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: >-
          dnf install -y gcc rust cargo pkgconf-pkg-config
          gtk4-devel libadwaita-devel gtk4-layer-shell-devel dbus-devel
      - name: Build
        run: cargo build
